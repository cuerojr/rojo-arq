# docker-compose.yml
services:
  db:
    image: postgres:17
    container_name: rojo-arq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_xVgj3FDmU4vH
      POSTGRES_DB: neondb
    ports:
      - "5433:5432" # 5433 para no chocar con un Postgres local que ya tengas en 5432
    volumes:
      - rojo-arq-pgdata:/var/lib/postgresql/data

volumes:
  rojo-arq-pgdata: